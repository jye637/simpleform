<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>好朋友聚會 Friends Gathering</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      max-width: 500px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 40px 20px;
      text-align: center;
      color: white;
    }

    .header h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .header p {
      font-size: 0.95rem;
      opacity: 0.9;
      font-weight: 300;
    }

    .content {
      padding: 30px;
    }

    .info {
      background-color: #f0f4ff;
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 30px;
      border-left: 4px solid #667eea;
      font-size: 0.95rem;
      line-height: 2;
      color: #333;
    }

    .info strong {
      color: #667eea;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      background-color: #fafafa;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      background-color: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input[type="text"]::placeholder {
      color: #999;
    }

    .button-group {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.3px;
    }

    .submit-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .view-participants-btn {
      background-color: #f0f4ff;
      color: #667eea;
      border: 2px solid #667eea;
      margin-top: 20px;
      width: 100%;
    }

    .view-participants-btn:hover {
      background-color: #667eea;
      color: white;
      transform: translateY(-2px);
    }

    .view-participants-btn:active {
      transform: translateY(0);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background-color: white;
      margin: 10% auto;
      padding: 0;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      max-width: 450px;
      width: 90%;
      max-height: 70vh;
      overflow-y: auto;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 12px 12px 0 0;
    }

    .modal-header h2 {
      font-size: 1.3rem;
      margin: 0;
      font-weight: 600;
    }

    .close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .close-btn:hover {
      transform: rotate(90deg);
    }

    .modal-body {
      padding: 20px;
    }

    .participants-count {
      text-align: center;
      padding: 10px 0;
      color: #667eea;
      font-size: 0.9rem;
      font-weight: 600;
      border-bottom: 1px solid #e0e0e0;
      margin-bottom: 15px;
    }

    .participant-list {
      list-style: none;
    }

    .participant-list li {
      padding: 12px 14px;
      border-bottom: 1px solid #f0f0f0;
      color: #333;
      font-size: 0.95rem;
      transition: background-color 0.2s ease;
    }

    .participant-list li:hover {
      background-color: #f9f9f9;
    }

    .participant-list li:last-child {
      border-bottom: none;
    }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: #999;
      font-size: 0.95rem;
    }

    .empty-state-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>好朋友聚會</h1>
      <p>Friends Gathering</p>
    </div>

    <div class="content">
      <div class="info">
        📅 <strong>日期 Date：</strong>10/17 (Oct 17)<br>
        ⏰ <strong>時間 Time：</strong>12:30 PM<br>
        📍 <strong>地點 Location：</strong>高雄市 (Kaohsiung City)<br>
        🍽️ <strong>餐廳 Restaurant：</strong>餐廳待決定 (To be decided)
      </div>

      <form id="signupForm">
        <div class="form-group">
          <label for="userName">請輸入姓名 / Name：</label>
          <input type="text" id="userName" placeholder="例如：帥氣傑克 / e.g., Handsome Jack" required>
        </div>
        <div class="button-group">
          <button type="submit" class="submit-btn">送出報名 / Submit</button>
        </div>
      </form>

      <button class="view-participants-btn" id="viewParticipantsBtn">
        👥 查看報名人員 / View Participants (<span id="participantCountBadge">0</span>)
      </button>
    </div>
  </div>

  <div id="participantsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>報名人員 Participants</h2>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="participants-count">
          共 <strong id="modalParticipantCount">0</strong> 人報名
        </div>
        <ul id="participantList" class="participant-list">
        </ul>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCLHiIcnAVltGycimzCFfSN2qTrScqVW0I",
      authDomain: "simple-form-922df.firebaseapp.com",
      projectId: "simple-form-922df",
      storageBucket: "simple-form-922df.firebasestorage.app",
      messagingSenderId: "51420169968",
      appId: "1:51420169968:web:3272597f827c2d8a332435",
      measurementId: "G-SYWJ6PGVMJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const signupForm = document.getElementById('signupForm');
    const userNameInput = document.getElementById('userName');
    const participantCountBadge = document.getElementById('participantCountBadge');
    const modalParticipantCount = document.getElementById('modalParticipantCount');
    const participantList = document.getElementById('participantList');
    const participantsModal = document.getElementById('participantsModal');
    const viewParticipantsBtn = document.getElementById('viewParticipantsBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const registrationsRef = collection(db, "registrations");

    viewParticipantsBtn.addEventListener('click', () => {
      participantsModal.style.display = 'block';
    });

    closeModalBtn.addEventListener('click', () => {
      participantsModal.style.display = 'none';
    });

    window.addEventListener('click', (event) => {
      if (event.target === participantsModal) {
        participantsModal.style.display = 'none';
      }
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = userNameInput.value.trim();

      if (!name) return;

      try {
        await addDoc(registrationsRef, {
          name: name,
          createdAt: serverTimestamp()
        });
        
        userNameInput.value = '';
        alert('報名成功！/ Registration successful!');
      } catch (error) {
        console.error("寫入資料失敗: ", error);
        alert('報名失敗，請稍後再試。 / Registration failed.');
      }
    });

    const q = query(registrationsRef, orderBy("createdAt", "asc"));
    onSnapshot(q, (snapshot) => {
      participantList.innerHTML = '';
      const count = snapshot.size;
      participantCountBadge.textContent = count;
      modalParticipantCount.textContent = count;

      if (count === 0) {
        const emptyState = document.createElement('div');
        emptyState.className = 'empty-state';
        emptyState.innerHTML = '<div class="empty-state-icon">📝</div><p>還沒有人報名 / No participants yet</p>';
        participantList.appendChild(emptyState);
      } else {
        snapshot.forEach((doc) => {
          const data = doc.data();
          if (data.name) {
            const li = document.createElement('li');
            li.textContent = data.name;
            participantList.appendChild(li);
          }
        });
      }
    });
  </script>

</body>
</html>
